<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>txshield - history</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body data-page="history">
  <header id="top" class="top"></header>
  <main>
    <h1>History</h1>
    <div class="grid">
      <section class="card" aria-labelledby="h-h">
        <h2 id="h-h">Past checks</h2>
        <div class="scroll">
          <table>
            <thead><tr><th scope="col">When</th><th scope="col">Verdict</th><th scope="col">What</th><th scope="col"><span class="sr">Open</span></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="row"><button id="clear" class="ghost" type="button">Clear history</button><span id="msg" class="err" role="alert"></span></div>
      </section>
      <section id="detail" class="card" aria-live="polite">
        <h2>Details</h2>
        <p class="muted">Pick an entry to see the full verdict again.</p>
      </section>
    </div>
  </main>
</body>
</html>
